name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docs:
    name: Documentation checks (front matter, IDs, links)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_docs.py

  database:
    name: Database DDL + integrity and tenant-isolation tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Create database
        run: createdb amcos
      - name: Apply reference DDL
        run: psql -d amcos -v ON_ERROR_STOP=1 -q -f database/ddl/DDL-000_core_schema_v0.9.sql
      - name: Run integrity and isolation tests
        run: |
          psql -d amcos -v ON_ERROR_STOP=1 -f database/tests/DBT-000_integrity_and_isolation_tests_v0.9.sql 2>&1 | tee test.log
          grep -q "All tests passed." test.log
      - name: Every tenant table has forced row-level security
        run: |
          n=$(psql -d amcos -Atc "select count(*) from pg_class k join pg_namespace s on s.oid=k.relnamespace where k.relkind in ('r','p') and s.nspname not in ('pg_catalog','information_schema','pg_toast') and not (s.nspname='platform' and k.relname='tenant') and exists (select 1 from pg_attribute a where a.attrelid=k.oid and a.attname='tenant_id' and not a.attisdropped) and not k.relforcerowsecurity")
          echo "Tenant tables without forced RLS: $n"
          test "$n" -eq 0
